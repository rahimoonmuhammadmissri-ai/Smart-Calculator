name: Build SmartCalc APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o SmartCalc.zip
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: SmartCalc
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmartCalc-debug-apk
          path: SmartCalc/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode keystore
        if: ${{ env.HAS_KEYSTORE != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > SmartCalc/app/release-keystore.jks

      - name: Build signed release AAB (for Play Store)
        if: ${{ env.HAS_KEYSTORE != '' }}
        working-directory: SmartCalc
        env:
          KEYSTORE_PATH: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Upload release AAB
        if: ${{ env.HAS_KEYSTORE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalc-release-aab
          path: SmartCalc/app/build/outputs/bundle/release/app-release.aab
